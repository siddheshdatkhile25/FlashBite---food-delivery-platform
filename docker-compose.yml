# FlashBite local development stack (MVP — Docker Compose per PRD)
# Services: wire Spring Boot apps after initial implementation

services:
  api-gateway:
    image: maven:3.9.9-eclipse-temurin-17
    profiles:
      - gateway
    working_dir: /workspace/backend
    command: ["mvn", "-pl", "api-gateway", "-am", "spring-boot:run"]
    environment:
      EUREKA_ENABLED: "false"
      USER_SERVICE_URI: http://host.docker.internal:8082
      RESTAURANT_SERVICE_URI: http://host.docker.internal:8083
      ORDER_SERVICE_URI: http://host.docker.internal:8084
      PAYMENT_SERVICE_URI: http://host.docker.internal:8085
      DELIVERY_SERVICE_URI: http://host.docker.internal:8086
      NOTIFICATION_SERVICE_URI: http://host.docker.internal:8087
      SEARCH_SERVICE_URI: http://host.docker.internal:8088
      ANALYTICS_SERVICE_URI: http://host.docker.internal:8089
      FLASHBITE_JWT_SECRET: flashbite-dev-jwt-secret-change-me-1234567890abcdef
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/workspace/backend
      - maven_cache:/root/.m2
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flashbite
      POSTGRES_PASSWORD: flashbite
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  maven_cache:
  postgres_data:
  mongo_data:
