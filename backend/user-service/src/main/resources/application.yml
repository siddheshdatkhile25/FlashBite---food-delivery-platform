spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${USER_SERVICE_DATABASE_NAME:flashbite_user}
    username: ${DATABASE_USERNAME:flashbite}
    password: ${DATABASE_PASSWORD:flashbite}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    table: flyway_user_history
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

flashbite:
  auth:
    jwt-secret: ${FLASHBITE_JWT_SECRET:flashbite-dev-jwt-secret-change-me-1234567890abcdef}
    access-token-ttl-seconds: ${FLASHBITE_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${FLASHBITE_REFRESH_TOKEN_TTL_SECONDS:604800}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - email
              - profile
          
